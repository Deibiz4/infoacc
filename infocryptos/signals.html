    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"

    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }

        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            transition: color 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text-main);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-family: 'Outfit', sans-serif;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.2rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: var(--glass);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-badge.PENDING {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-badge.ACTIVE {
            background: rgba(0, 242, 254, 0.2);
            color: var(--primary);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .status-badge.HIT_TARGET {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.HIT_STOP {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .ticker {
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .type-long {
            color: var(--success);
            font-size: 0.8rem;
            padding: 0.1rem 0.4rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 0.3rem;
        }

        .type-short {
            color: var(--danger);
            font-size: 0.8rem;
            padding: 0.1rem 0.4rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.3rem;
        }
    </style>
</head>

        // Function to load and display signals
        async function loadSignals() {
            try {
                let signals = [];
                try {
                    const response = await fetch('data/signals.json');
                    signals = await response.json();
                } catch (e) {
                    console.warn("Fetch failed (CORS local file restriction). Loading embedded data...", e);
                    signals = window.SIGNALS_DATA;
                }

                if (!signals || signals.length === 0) {
                    signals = window.SIGNALS_DATA || [];
                }

                const tbody = document.getElementById('signals-body');
                tbody.innerHTML = '';

                let wins = 0;
                let losses = 0;
                let active = 0;
                let totalClosed = 0;

                // Sort by date descending
                signals.sort((a, b) => new Date(b.date) - new Date(a.date));

                signals.forEach(signal => {
                    // Update stats
                    if (signal.status === 'HIT_TARGET') { wins++; totalClosed++; }
                    if (signal.status === 'HIT_STOP') { losses++; totalClosed++; }
                    if (signal.status === 'PENDING' || signal.status === 'ACTIVE') active++;

                    const tr = document.createElement('tr');

                    // Determine type tag
                    const typeTag = signal.type === 'LONG'
                        ? '<span class="type-long">L</span>'
                        : '<span class="type-short">S</span>';

                    tr.innerHTML = `
                        <td>${signal.date}</td>
                        <td>
                            <div class="ticker">
                                ${signal.ticker}
                                ${typeTag}
                            </div>
                        </td>
                        <td style="color: var(--text-muted); font-size: 0.85rem;">${signal.context}</td>
                        <td style="font-weight: 600;">$${signal.entry_price}</td>
                        <td style="color: var(--success);">$${signal.target_price}</td>
                        <td style="color: var(--danger);">$${signal.stop_loss}</td>
                        <td><span class="status-badge ${signal.status}">${signal.status.replace('_', ' ')}</span></td>
                        <td style="color: var(--text-muted); font-size: 0.85rem; max-width: 250px;">${signal.notes}</td>
                    `;
                    tbody.appendChild(tr);
                });

                // Update Stats Display
                const winRate = totalClosed > 0 ? Math.round((wins / totalClosed) * 100) : 0;

                document.getElementById('total-signals').textContent = signals.length;
                document.getElementById('active-signals').textContent = active;
                document.getElementById('win-rate').textContent = winRate + '%';
                // Display won vs lost instead of estimated factor
                document.getElementById('pnl-factor').textContent = `${wins} G / ${losses} P`;

            } catch (error) {
                console.error('Error loading signals:', error);
                document.getElementById('signals-body').innerHTML = `
                    <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--danger);">Error loading signals. Please check data format.</td></tr>
                `;
            }
        }

        loadSignals();
