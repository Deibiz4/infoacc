name: Daily Market Intelligence Report

on:
  schedule:
    # Runs at 07:00 AM UTC every weekday (Monday through Friday)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Master Market Workflow
        run: |
          python master_workflow.py

      - name: Commit & Push Updated Reports and Analytics
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "auto: Daily Market Intelligence Report update [skip ci]" && git push)
